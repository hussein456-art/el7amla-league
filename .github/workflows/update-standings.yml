name: تحديث الترتيب أوتوماتيك

on:
  schedule:
    - cron: "*/5 * * * *"   # كل 5 دقايق (أسرع توقيت آمن ومسموح فعلياً على GitHub)
  workflow_dispatch:        # يسمح بتشغيله يدوياً من تاب Actions لو احتجت

concurrency:
  group: update-standings   # يمنع تشغيلتين في نفس الوقت لو تشغيلة قديمة لسه شغالة
  cancel-in-progress: false

permissions:
  contents: write   # لازم عشان السكريبت يقدر يعمل commit/push للنتيجة

jobs:
  update-standings:
    runs-on: ubuntu-latest
    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: تجهيز بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: تشغيل سكريبت الحساب
        run: python scripts/update_standings.py

      - name: حفظ النتيجة على GitHub (لو فيه تغيير فعلي)
        run: |
          git config user.name "el7amla-bot"
          git config user.email "bot@el7amla-league.local"
          git add data/standings.json
          git diff --staged --quiet || git commit -m "تحديث الترتيب أوتوماتيك"
          git push
